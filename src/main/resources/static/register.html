<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Nimbo · Crear cuenta</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
            rel="stylesheet"
    >

    <style>

        :root {
          --bg:#0A0F1C;
          --panel:#10182B;
          --input:#0F1526;
          --ink:#EAF2FF;
          --ink-soft:#7C8CB3;
          --line:#1E2B45;
          --cyan:#5CE1E6;
          --bad:#FF6B6B;
        }

        * {
          box-sizing:border-box;
        }

        body {
          margin:0;
          min-height:100vh;
          background:var(--bg);
          color:var(--ink);
          font-family:'Inter',sans-serif;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:24px;
        }

        .panel {
          width:100%;
          max-width:420px;
          background:var(--panel);
          border:1px solid var(--line);
          border-radius:16px;
          padding:30px;
        }

        .brand {
          font-family:'Space Grotesk',sans-serif;
          font-weight:700;
          font-size:17px;
          letter-spacing:.1em;
          margin-bottom:28px;
        }

        .accent {
          color:var(--cyan);
        }

        h1 {
          font-family:'Space Grotesk',sans-serif;
          font-size:24px;
          margin:0 0 8px;
        }

        .intro {
          color:var(--ink-soft);
          line-height:1.5;
          margin:0 0 26px;
          font-size:14px;
        }

        label {
          display:block;
          margin-bottom:18px;
          color:var(--ink-soft);
          font-size:13px;
        }

        input {
          display:block;
          width:100%;
          margin-top:8px;
          padding:12px 14px;
          border-radius:10px;
          border:1px solid var(--line);
          background:var(--input);
          color:var(--ink);
          font:inherit;
          outline:none;
        }

        input:focus {
          border-color:var(--cyan);
        }

        button {
          width:100%;
          border:0;
          border-radius:12px;
          padding:14px;
          background:var(--cyan);
          color:#0A0F1C;
          font-weight:700;
          font-size:15px;
          cursor:pointer;
        }

        button:disabled {
          opacity:.7;
          cursor:wait;
        }

        .message {
          min-height:20px;
          margin-top:16px;
          text-align:center;
          font-size:13px;
        }

        .error {
          color:var(--bad);
        }

        .links {
          margin-top:22px;
          text-align:center;
          color:var(--ink-soft);
          font-size:13px;
        }

        a {
          color:var(--cyan);
          text-decoration:none;
        }

    </style>

</head>


<body>

<div class="panel">

    <div class="brand">
        NIM<span class="accent">B</span>O
    </div>

    <h1>Crear cuenta</h1>

    <p class="intro">
        Crea tu cuenta gratuita para acceder a tu espacio personal.
    </p>

    <form id="registerForm">

        <label>
            Nombre

            <input
                    id="name"
                    type="text"
                    autocomplete="name"
                    required
            >
        </label>

        <label>
            Email

            <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
            >
        </label>

        <label>
            Contraseña

            <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >
        </label>

        <label>
            Repite la contraseña

            <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >
        </label>

        <button
                id="submitButton"
                type="submit"
        >
            Crear mi cuenta
        </button>

    </form>

    <div
            id="message"
            class="message"
    ></div>

    <div class="links">
        ¿Ya tienes cuenta?
        <a href="login.html">
            Iniciar sesión
        </a>
    </div>

</div>


<script>

    //region Configuration

    const API_URL =
      '';

    //endregion


    //region Registration

    document
      .getElementById('registerForm')
      .addEventListener(
        'submit',
        async function(event) {

          event.preventDefault();

          const password =
            document
              .getElementById('password')
              .value;

          const confirmPassword =
            document
              .getElementById('confirmPassword')
              .value;


          const message =
            document.getElementById(
              'message'
            );

          const button =
            document.getElementById(
              'submitButton'
            );


          if (password !== confirmPassword) {

            message.innerHTML =
              '<span class="error">' +
              'Las contraseñas no coinciden.' +
              '</span>';

            return;
          }


          button.disabled = true;
          button.textContent = 'Creando cuenta...';
          message.innerHTML = '';


          try {

            const response =
              await fetch(

                '/api/auth/register',
                {
                  method:'POST',

                  headers:{
                    'Content-Type':
                      'application/json'
                  },

                  body:JSON.stringify({

                    name:
                      document
                        .getElementById('name')
                        .value,

                    email:
                      document
                        .getElementById('email')
                        .value,

                    password:
                      password
                  })
                }
              );


            const result =
              await response.json();


            if (!response.ok ||
                !result.ok) {

              throw new Error(
                result.error ||
                'No se ha podido crear la cuenta.'
              );
            }


            localStorage.setItem(
              'nimboUser',
              JSON.stringify(
                result.user
              )
            );


            window.location.href =
              'dashboard.html';

          } catch (error) {

            message.innerHTML =
              '<span class="error">' +
              error.message +
              '</span>';

            button.disabled = false;
            button.textContent =
              'Crear mi cuenta';
          }

        }
      );

    //endregion

</script>

</body>

</html>
