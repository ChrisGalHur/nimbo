<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Nimbo · Finanzas con estructura</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
            rel="stylesheet"
    >

    <style>

        :root {
          --bg:#0A0F1C;
          --panel:#10182B;
          --ink:#EAF2FF;
          --ink-soft:#7C8CB3;
          --line:#1E2B45;
          --cyan:#5CE1E6;
          --blue:#5C86FF;
        }

        * {
          box-sizing:border-box;
        }

        body {
          margin:0;
          min-height:100vh;
          background:var(--bg);
          color:var(--ink);
          font-family:'Inter',sans-serif;
        }

        .wrap {
          max-width:900px;
          margin:0 auto;
          padding:32px;
        }

        .topbar {
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .brand {
          font-family:'Space Grotesk',sans-serif;
          font-weight:700;
          font-size:18px;
          letter-spacing:.1em;
        }

        .accent {
          color:var(--cyan);
        }

        .login {
          color:var(--ink-soft);
          text-decoration:none;
          font-size:13px;
        }

        .login:hover {
          color:var(--cyan);
        }

        .hero {
          max-width:700px;
          padding:120px 0 90px;
        }

        .eyebrow {
          color:var(--cyan);
          font-family:'IBM Plex Mono',monospace;
          font-size:11px;
          letter-spacing:.1em;
          text-transform:uppercase;
          margin-bottom:16px;
        }

        h1 {
          font-family:'Space Grotesk',sans-serif;
          font-size:52px;
          line-height:1.05;
          margin:0 0 22px;
          letter-spacing:-.03em;
        }

        .hero p {
          max-width:620px;
          color:var(--ink-soft);
          font-size:17px;
          line-height:1.65;
          margin:0 0 32px;
        }

        .actions {
          display:flex;
          gap:12px;
          flex-wrap:wrap;
        }

        .button {
          display:inline-block;
          padding:14px 18px;
          border-radius:11px;
          text-decoration:none;
          font-size:14px;
          font-weight:700;
        }

        .primary {
          background:var(--cyan);
          color:#0A0F1C;
        }

        .secondary {
          border:1px solid var(--line);
          color:var(--ink);
          background:var(--panel);
        }

        .secondary:hover {
          border-color:var(--cyan);
        }

        @media(max-width:600px) {

          .wrap {
            padding:20px;
          }

          .hero {
            padding:90px 0 60px;
          }

          h1 {
            font-size:40px;
          }

        }

    </style>

</head>


<body>

<div class="wrap">

    <header class="topbar">

        <div class="brand">
            NIM<span class="accent">B</span>O
        </div>

        <a
                class="login"
                href="login.html"
        >
            Iniciar sesión
        </a>

    </header>


    <main class="hero">

        <div class="eyebrow">
            Finanzas con estructura
        </div>

        <h1>
            Entiende dónde estás.
            Decide hacia dónde ir.
        </h1>

        <p>
            Nimbo analiza tu situación financiera y te ayuda a convertirla en un plan claro.
        </p>


        <div class="actions">

            <a
                    class="button primary"
                    href="test.html"
            >
                Hacer mi diagnóstico →
            </a>

            <a
                    class="button secondary"
                    href="register.html"
            >
                Crear cuenta
            </a>

        </div>

    </main>

</div>

</body>

</html>
